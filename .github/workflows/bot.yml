name: Salamander Figure Bot

on:
  # 매일 한국 시간 아침 9시 (UTC 0시)에 자동 실행
  schedule:
    - cron: '0 0 * * *'
  
  # 깃허브 웹사이트에서 수동으로 즉시 실행할 수 있게 허용
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 내려받기
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 피규어 수집 봇 실행하기
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python figure_bot.py
